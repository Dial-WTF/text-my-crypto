name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # cloudflare-env.d.ts is gitignored, so generate it before anything type-checks.
      - run: pnpm cf-typegen
      # Typecheck runs `next typegen`, which writes the route types (RouteContext) that type-aware lint reads,
      # so it goes before lint. Same order as scripts/ship.mjs.
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
