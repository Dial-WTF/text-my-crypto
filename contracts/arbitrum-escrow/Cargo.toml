[package]
name = "dial-escrow"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Escrow for Dial payments to phone numbers that are not on Dial yet (Arbitrum Stylus)"

[lib]
name = "dial_escrow"
crate-type = ["lib", "cdylib"]

[dependencies]
alloy-primitives = "1.5.7"
alloy-sol-types = "1.5.7"
stylus-sdk = "=0.10.10"

[dev-dependencies]
stylus-sdk = { version = "=0.10.10", features = ["stylus-test"] }
k256 = { version = "0.13", features = ["ecdsa"] }

[features]
default = ["mini-alloc"]
export-abi = ["stylus-sdk/export-abi"]
debug = ["stylus-sdk/debug"]
mini-alloc = ["stylus-sdk/mini-alloc"]
contract-client-gen = []

[profile.release]
codegen-units = 1
strip = true
lto = true
panic = "abort"
opt-level = "z"
