name: Deploy

# main → checks → staging (migrate, deploy, smoke test) → production (migrate, deploy).
# Production only gets a build that passed the smoke test on staging. All of it is scripts/ship.mjs,
# so `pnpm ship` does the same thing from a laptop.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # The staging Worker's SMS_WEBHOOK_SECRET, for the smoke test.
      SMOKE_SECRET: ${{ secrets.STAGING_SMS_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Checks, staging and smoke test, then production
        run: pnpm ship
