[package]
name = "zcash-wallet"
version = "0.1.0"
edition = "2024"
publish = false
description = "Dial's Zcash testnet wallet service: shielded accounts, balances and sends over HTTP."

# Zcash testnet activated NU7 at height 4,465,026. Only the librustzcash NU7 pre-release
# cohort builds valid transactions there, so these are pinned exactly, like Zallet does.
[dependencies]
zcash_client_backend = { version = "=0.25.0-pre.1", features = ["lightwalletd-tonic-tls-webpki-roots", "lightwalletd-tonic-transport", "sync", "orchard"] }
zcash_client_sqlite = { version = "=0.23.0-pre.1", features = ["orchard"] }
zcash_keys = { version = "=0.17.0-pre.1", features = ["orchard", "sapling"] }
zcash_primitives = "=0.31.0-pre.1"
zcash_proofs = { version = "=0.31.0-pre.1", features = ["bundled-prover"] }
zcash_protocol = "=0.11.0-pre.0"
zcash_address = "=0.14.0-pre.1"
zip32 = "0.3"
zip321 = "=0.10.0-pre.1"

anyhow = "1"
axum = "0.8"
bip0039 = { version = "0.14", features = ["std"] }
rand = "0.10"
rand_core = "0.10"
rusqlite = "0.37"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
nonempty = "0.11"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tonic = { version = "0.14", features = ["tls-webpki-roots", "transport"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"

[profile.release]
opt-level = 3
